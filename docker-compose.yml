services:
  postgres:
    image: postgres:15-alpine
    container_name: wardell_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: wardell
      POSTGRES_PASSWORD: wardell_password_dev
      POSTGRES_DB: wardell_leads
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wardell -d wardell_leads"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: wardell_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: wardell_backend
    restart: unless-stopped
    environment:
      - NODE_ENV=development
      - PORT=4000
      - DATABASE_URL=postgresql://wardell:wardell_password_dev@postgres:5432/wardell_leads?schema=public
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DRY_RUN=true
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
